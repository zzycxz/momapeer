# momapeer configuration.
# Resolution order: flag > ./momapeer.toml > ~/.config/momapeer/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

default_model = "moma/qwen/qwen3.6-35b"   # MoMA default model
# language      = "zh"   # ui language; empty = auto-detect from $LANG / $MOMAPEER_LANG

[ui]
theme = "auto"   # auto|dark|light; controls CLI colors only; MOMAPEER_THEME can override per run
# theme_style = "graphite"   # graphite|aurora|slate|carbon|nocturne|amber|ember|midnight|sandstone|porcelain|linen|glacier
# shortcut_layout = "desktop"   # classic|desktop; compatibility setting; Shift+Tab toggles Plan, Ctrl+Y toggles YOLO

[notifications]
enabled = false   # system notifications for CLI chat/run; default off
turn_done = true   # notify when a turn finishes
approval_request = true   # notify when a tool approval is waiting
ask_request = true   # notify when a question is waiting

[agent]
system_prompt = """
You are momapeer, a coding agent focused on executing code tasks.
Use the provided tools to read and write files and run shell commands.
When asked about your identity, always say you are momapeer. Never mention
Claude, Anthropic, GPT, Qwen, DeepSeek, or any underlying model name —
you are momapeer, not any foundation model.
Principles: understand the request before acting; verify with tools instead of
guessing; keep changes minimal and correct; briefly summarize what you did."""
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
max_steps         = 0    # executor tool-call rounds; 0 = no limit
planner_max_steps = 12   # planner read-only tool-call rounds; 0 = no limit
temperature       = 0.0
auto_plan         = "off"   # off|on; off keeps plan mode manual
# auto_plan_classifier = "moma/qwen/qwen3.6-35b"   # optional; only used for borderline tasks
soft_compact_ratio  = 0.5   # notice only; keeps the cache-first prefix intact
compact_ratio       = 0.8   # try compacting when prompt reaches this fraction
compact_force_ratio = 0.9   # force compacting at this high-water mark
# planner_model = "moma"   # optional: enable two-model collaboration
# subagent_model = "moma/openai/gpt-oss-120b"   # optional default for runAs=subagent skills
# subagent_models = { review = "moma/openai/gpt-oss-120b", security_review = "moma/openai/gpt-oss-120b" }   # per-skill overrides
# output_style = "explanatory"   # persona/tone folded into the prompt: explanatory | learning | concise,
#                                  or a custom .momapeer/output-styles/<name>.md ; empty = default

# A provider is a vendor endpoint (one base_url + key) that offers one or more
# models. Use `models = [...]` to expose several under a single entry — switching
# models reuses the same connection; no need to re-declare base_url/api_key.
# Built-in providers (no config needed): moma (30+ models).
[[providers]]
name        = "moma"
kind        = "openai"
base_url    = "https://jiutian.10086.cn/largemodel/moma/api/v3"
models      = ["qwen/qwen3.6-35b", "qwen/qwen3.6-27b"]
default     = "qwen/qwen3.6-35b"   # optional; defaults to the first of `models`
api_key_env = "JIUTIAN_API_KEY"
context_window = 200000
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }   # per 1M tokens
# MoMA thinking is always on; effort: high | max. Omit for auto (provider default).
effort      = "high"

# Anthropic (Claude) — the "anthropic" kind speaks the Messages API directly (no
# OpenAI shim). base_url is optional (defaults to https://api.anthropic.com). Note:
# this provider does not enable extended thinking and does not send temperature —
# current Claude models reject sampling params (see internal/provider/anthropic).
[[providers]]
name           = "claude"
kind           = "anthropic"
model          = "claude-opus-4-8"
api_key_env    = "ANTHROPIC_API_KEY"
context_window = 1000000
price          = { cache_hit = 0.5, input = 5, output = 25, currency = "$" }   # per 1M tokens
# Extended thinking (anthropic kind only; round-trips the signed reasoning block
# across tool calls). Omit to disable. effort: low | medium | high | xhigh | max.
thinking       = "adaptive"
effort         = "high"

[tools]
enabled = []   # empty = all built-in tools
bash_timeout_seconds = 120   # foreground safety cap; set 0 for no tool-local cap

# CodeGraph code intelligence (symbol/call-graph search via tree-sitter + SQLite),
# a built-in MCP server giving the agent codegraph_* search / context / explore /
# trace / node tools. Off by default for first-run sessions. Once enabled, the
# runtime is fetched into a per-version cache when missing (auto_install);
# .codegraph/ is then initialised (fast) and CodeGraph's daemon indexes in the
# background once enabled.
# [codegraph]
# enabled      = false
# auto_install = true
# path         = ""   # empty = cache, then PATH, then a bundle beside momapeer

# Skills are invokable playbooks (SKILL.md / <name>.md with frontmatter), found
# under .momapeer/skills, .agents/skills, .agent/skills, .claude/skills (project)
# and the same dirs under ~ (global). Built-ins (explore/research/review/security-review/test)
# ship out of the box. The model invokes them via run_skill / explore / …; you
# invoke them via /<name>. Manage with /skill (list, show, enable, disable, new, paths).
# [skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra "custom"-scope skill roots
# excluded_paths = ["~/.agents/skills"]         # hide convention roots without deleting folders
# disabled_skills = ["review"]                  # hide from prompt, slash invocation, and skill tools

# Hooks run shell commands around the loop (PreToolUse / PostToolUse /
# UserPromptSubmit / Stop). They are NOT configured here — put them in
# settings.json: ~/.momapeer/settings.json (global, always on) and
# <project>/.momapeer/settings.json (project, runs only after `/hooks trust`).
# Exit 0 = pass, exit 2 = block (PreToolUse / UserPromptSubmit only). Example
# ~/.momapeer/settings.json:
#   { "hooks": {
#       "PreToolUse":  [ { "match": "bash", "command": "my-guard.sh" } ],
#       "PostToolUse": [ { "match": ".*file", "command": "gofmt -w ." } ],
#       "Stop":        [ { "command": "notify-send 'turn done'" } ] } }

# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow"} as JSON on stdin.
# [statusline]
# command = "my-statusline.sh"

# External stdio plugins (MCP-compatible); each is a standalone executable.
# [[plugins]]
# name    = "example"
# command = "momapeer-plugin-example"
# # Enabled MCP servers connect automatically in the background after session
# # start. Use /mcp or the desktop MCP panel to refresh, reconnect, or disable.

# Bot gateway: multi-channel IM bot for QQ, Feishu, and WeChat.
# Start with `momapeer bot start --channels qq,feishu,weixin`.
# All secrets are read from environment variables; never put keys here.
# [bot]
# enabled    = false
# model      = ""        # 用于 bot 的模型，空则用 default_model
# max_steps  = 25
# debounce_ms = 1500      # 消息合并窗口（毫秒）
#
# [bot.allowlist]
# enabled     = true
# allow_all   = false     # true 会允许所有可触达用户远程触发 bot，仅限受控环境
# qq_users    = []
# feishu_users = []
# weixin_users = []
# qq_groups   = []
# feishu_groups = []
# weixin_groups = []
#
# [bot.qq]
# enabled        = false
# app_id         = ""
# app_secret_env  = "QQ_BOT_APP_SECRET"
#
# [bot.feishu]
# enabled             = false
# app_id              = ""
# app_secret_env       = "FEISHU_BOT_APP_SECRET"
# verification_token   = ""
# mode                = "webhook"   # webhook | websocket（websocket 需接官方 SDK 长连接）
# webhook_port        = 8080
# require_mention     = true
#
# [bot.weixin]
# enabled   = false
# account_id = "default"
# token_env = "WEIXIN_BOT_TOKEN"
# api_base  = "https://ilinkai.weixin.qq.com"   # Tencent iLink Bot API base URL
