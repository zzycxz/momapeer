name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Desktop App
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            args: ''
            artifact: momapeer.exe
          - os: macos-latest
            platform: darwin/universal
            args: ''
            artifact: momapeer.app
          - os: ubuntu-22.04
            platform: linux/amd64
            args: ''
            artifact: momapeer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './desktop/frontend/pnpm-lock.yaml'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        working-directory: ./desktop
        run: wails build -platform ${{ matrix.platform }} -clean ${{ matrix.args }}

      - name: Rename Linux Artifact
        if: runner.os == 'Linux'
        working-directory: ./desktop/build/bin
        run: mv momapeer momapeer-linux-amd64

      - name: Compress macOS app
        if: runner.os == 'macOS'
        working-directory: ./desktop/build/bin
        run: zip -r momapeer-macos-universal.zip momapeer.app

      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./desktop/build/bin/momapeer.exe

      - name: Upload macOS Artifact
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./desktop/build/bin/momapeer-macos-universal.zip

      - name: Upload Linux Artifact
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./desktop/build/bin/momapeer-linux-amd64
