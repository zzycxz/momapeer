name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/amd64
            artifact: momapeer-macos-intel.zip
            binary_name: momapeer.app
            apt_deps: ''
            build_args: ''

          - os: macos-latest
            platform: darwin/arm64
            artifact: momapeer-macos-silicon.zip
            binary_name: momapeer.app
            apt_deps: ''
            build_args: ''

          - os: windows-latest
            platform: windows/amd64
            artifact: momapeer-windows-amd64.exe
            binary_name: momapeer.exe
            apt_deps: ''
            build_args: ''

          - os: windows-latest
            platform: windows/arm64
            artifact: momapeer-windows-arm64.exe
            binary_name: momapeer.exe
            apt_deps: ''
            build_args: ''

          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: momapeer-linux-amd64
            binary_name: momapeer
            apt_deps: 'libgtk-3-dev libwebkit2gtk-4.0-dev'
            build_args: ''

          - os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: momapeer-linux-arm64
            binary_name: momapeer
            apt_deps: 'libgtk-3-dev libwebkit2gtk-4.1-dev'
            build_args: '-tags webkit2_41'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0



      - name: Setup LLVM-MinGW (Windows ARM64)
        if: matrix.platform == 'windows/arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20260602/llvm-mingw-20260602-ucrt-x86_64.zip" -OutFile "llvm-mingw.zip"
          Expand-Archive llvm-mingw.zip -DestinationPath C:\
          echo "C:\llvm-mingw-20260602-ucrt-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Linux Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_deps }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Inject version from tag
        id: version
        shell: bash
        run: |
          # desktop-v0.1.5 → v0.1.5
          ver="${{ github.ref_name }}"
          ver="${ver#desktop-}"
          echo "semver=$ver" >> "$GITHUB_OUTPUT"

      - name: Build Wails App (Windows ARM64)
        if: matrix.platform == 'windows/arm64'
        working-directory: ./desktop
        shell: bash
        env:
          CC: aarch64-w64-mingw32-gcc
          CXX: aarch64-w64-mingw32-g++
        run: |
          wails build -platform ${{ matrix.platform }} -clean ${{ matrix.build_args }} -ldflags "-s -w -X main.version=${{ steps.version.outputs.semver }}" -upx -v 2 > wails_build.log 2>&1
          if [ $? -ne 0 ]; then echo "Wails build failed"; exit 1; fi

      - name: Build Wails App (Others)
        if: matrix.platform != 'windows/arm64'
        working-directory: ./desktop
        shell: bash
        run: |
          wails build -platform ${{ matrix.platform }} -clean ${{ matrix.build_args }} -ldflags "-s -w -X main.version=${{ steps.version.outputs.semver }}" -upx -v 2 > wails_build.log 2>&1
          if [ $? -ne 0 ]; then
            echo "Wails build failed"
            exit 1
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wails-build-log-${{ matrix.os }}
          path: ./desktop/wails_build.log

      - name: Compress macOS app
        if: runner.os == 'macOS'
        working-directory: ./desktop/build/bin
        run: zip -r ${{ matrix.artifact }} ${{ matrix.binary_name }}

      - name: Rename Artifact (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: ./desktop/build/bin
        run: mv ${{ matrix.binary_name }} ${{ matrix.artifact }}

      - name: Rename Artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: ./desktop/build/bin
        run: Rename-Item -Path "${{ matrix.binary_name }}" -NewName "${{ matrix.artifact }}"

      - name: Upload Artifact
        uses: softprops/action-gh-release@v2
        with:
          name: momapeer ${{ github.ref_name }}
          make_latest: true
          body: |
            ## MoMAPeer Desktop ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/zzycxz/momapeer/blob/main/CHANGELOG.md) for details.
          files: ./desktop/build/bin/${{ matrix.artifact }}

  manifest:
    name: Generate Auto-Updater Manifest
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download release artifacts (exclude stale signatures)
        run: |
          mkdir -p release-assets
          gh release download ${{ github.ref_name }} --dir release-assets --pattern '*.exe' --pattern '*.zip' --pattern '*.tar.gz' --pattern '*.deb' --pattern 'latest.json' || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign artifacts
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_PRIVATE_KEY" ] || [ -z "$MINISIGN_PASSWORD" ]; then
            echo "Error: MINISIGN_PRIVATE_KEY or MINISIGN_PASSWORD secret is missing in repository settings!"
            exit 1
          fi
          cd desktop
          go run ./cmd/sign sign ../release-assets/*

      - name: Generate Manifest
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#desktop-}"
          cd desktop
          go run ./cmd/sign manifest ../release-assets "$VERSION" "${{ github.ref_name }}"

      - name: Upload Manifest
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/latest.json

      - name: Upload Signatures (separate release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-sigs
          name: ${{ github.ref_name }} signatures
          prerelease: false
          files: release-assets/*.minisig
