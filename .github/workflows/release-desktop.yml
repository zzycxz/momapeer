name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/amd64
            artifact: momapeer-macos-intel.zip
            binary_name: momapeer.app
            apt_deps: ''
            build_args: ''

          - os: macos-latest
            platform: darwin/arm64
            artifact: momapeer-macos-silicon.zip
            binary_name: momapeer.app
            apt_deps: ''
            build_args: ''

          - os: windows-latest
            platform: windows/amd64
            artifact: momapeer-windows-amd64.exe
            binary_name: momapeer.exe
            apt_deps: ''
            build_args: ''

          - os: windows-latest
            platform: windows/arm64
            artifact: momapeer-windows-arm64.exe
            binary_name: momapeer.exe
            apt_deps: ''
            build_args: ''

          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: momapeer-linux-amd64
            binary_name: momapeer
            apt_deps: 'libgtk-3-dev libwebkit2gtk-4.0-dev'
            build_args: ''

          - os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: momapeer-linux-arm64
            binary_name: momapeer
            apt_deps: 'libgtk-3-dev libwebkit2gtk-4.1-dev'
            build_args: '-tags webkit2_41'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0



      - name: Setup LLVM-MinGW (Windows ARM64)
        if: matrix.platform == 'windows/arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20260602/llvm-mingw-20260602-ucrt-x86_64.zip" -OutFile "llvm-mingw.zip"
          Expand-Archive llvm-mingw.zip -DestinationPath C:\
          echo "C:\llvm-mingw-20260602-ucrt-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Linux Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_deps }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App (Windows ARM64)
        if: matrix.platform == 'windows/arm64'
        working-directory: ./desktop
        env:
          CC: aarch64-w64-mingw32-gcc
          CXX: aarch64-w64-mingw32-g++
        run: wails build -platform ${{ matrix.platform }} -clean ${{ matrix.build_args }} -v 2

      - name: Build Wails App (Others)
        if: matrix.platform != 'windows/arm64'
        working-directory: ./desktop
        run: wails build -platform ${{ matrix.platform }} -clean ${{ matrix.build_args }} -v 2

      - name: Compress macOS app
        if: runner.os == 'macOS'
        working-directory: ./desktop/build/bin
        run: zip -r ${{ matrix.artifact }} ${{ matrix.binary_name }}

      - name: Rename Artifact (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: ./desktop/build/bin
        run: mv ${{ matrix.binary_name }} ${{ matrix.artifact }}

      - name: Rename Artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: ./desktop/build/bin
        run: Rename-Item -Path "${{ matrix.binary_name }}" -NewName "${{ matrix.artifact }}"

      - name: Upload Artifact
        uses: softprops/action-gh-release@v2
        with:
          name: momapeer ${{ github.ref_name }}
          generate_release_notes: true
          files: ./desktop/build/bin/${{ matrix.artifact }}
